# Server-side backstop for the local pre-commit hooks.
#
# These are plain container jobs, not GitLab's Secret Detection template. The
# template's merge-request widget and server-side push protection are Ultimate
# tier; a container job works on any tier and scans the same content.
#
# The difference that matters: these jobs scan FULL HISTORY, not the staged
# diff. That is what catches a secret committed before the hooks existed, or
# pushed by someone who bypassed them. GIT_DEPTH: 0 is what makes that true --
# the default shallow clone would give the scanners one commit to look at.

stages:
  - scan

# The available instance runners require this tag; they do not run untagged jobs.
default:
  tags:
    - itup-alm-x86

gitleaks:
  stage: scan
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks git . --config .gitleaks.toml --redact --verbose
      --report-format sarif --report-path gitleaks.sarif
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gitleaks.sarif

trufflehog:
  stage: scan
  image:
    name: trufflesecurity/trufflehog:3.97.9
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - trufflehog git file://. --only-verified --fail --no-update --json
      > trufflehog.json || (cat trufflehog.json && exit 1)
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trufflehog.json
